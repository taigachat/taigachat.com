<extend template="base.shtml">
<head id="head">
	<link rel="prefetch" href="$site.page('').link()">

	<link type="text/css" rel="stylesheet" href="$site.asset('highlight.css').link()">
	<!-- mathtex -->
	<link type="text/css" rel="stylesheet" href="$site.asset('Temml-Local.css').link()">
	<script defer src="$site.asset('temml.min.js').link()"></script>
	<script defer src="$site.asset('render-mathtex.js').link()"></script>
	<!-- /mathtex -->

	<style>
		
		#the-post {
			display:flex;
			flex-direction: column;
		}
		
		#the-post figure {
			display: flex;
			flex-flow: column;
			align-self: center;
			align-items: center;
			text-align: center;
			font-style: italic;
			max-width: 180mm;
		}

		#the-post img {
			width: 100%;
		}

		#the-post__links {
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			margin-top: 40px;
		}
	</style>
</head>
<div id="the-page">
	<h1 :text="$page.title"></h1>
	<div id="the-post" :html="$page.content()"></div>
	<div id="the-post__links">
		<div :if="$page.prevPage?()">
			<a href="$if.link()">
				←
				<span :text="$if.title"></span>
			</a>
		</div>
		<div :if="$page.nextPage?()">
			<a href="$if.link()">
				<span :text="$if.title"></span>
				→
			</a>
		</div>
	</div>
</div>
