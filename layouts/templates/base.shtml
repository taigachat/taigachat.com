<!DOCTYPE html>
<html>
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1">
		<title :text="$site.title"></title>
		<link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
		<link rel="icon" type="image/png" href="$site.asset('favicon.png').link()">
		<super>
	</head>
	<body id="body">
		<header id="the-topbar">
			<div id="the-topbar__upper">
				<span id="the-topbar__logo">
				</span>
				TaigaChat
			</div>
			<nav id="the-topbar__links">
				<a href="$site.page('').link()">Home</a>

			</nav>
		</header>
		<!--<h1 class="site-title" :text="$site.title"></h1>-->

		</div>
		<footer id="the-footer">
			<div>
				Site for
				<a href="/">TaigaChat</a>
				by
				Alexander
				<span :text="$build.git().commit_date.format('2006')"></span>
			</div>

			<h5>SITE UNDER CONSTRUCTION</h5>
